  pull_request:
    paths: ['services/dsh/preserve.py', 'scripts/stage-dsh-preservation.py', 'tests/test_dsh_preservation.py', 'tests/fixtures/dsh-preservation-requirements.txt', 'services/dsh/setup.py', 'services/dsh/remote.py', 'tests/test_dsh_setup.py', 'tests/test_dsh_modern_setup.py', 'tests/test_dsh_remote.py', 'packages/runtime/src/native-relocation-context.ts', 'tests/native-dsh-file-hints*.test.mjs', 'tests/fixtures/dsh-file-relocation.mjs', 'tests/dsh-project-files*.test.mjs', 'tests/test_dsh_project_files.py', 'tests/fixtures/dsh-file-project.mjs', 'packages/runtime/src/dsh-project-archive.ts', 'packages/runtime/src/dsh-display-preview.ts', 'packages/runtime/src/display-history.ts', 'scripts/dsh_project_bundle.py', 'tests/dsh-project-settlement*.test.mjs', 'tests/fixtures/dsh-settlement-project.mjs', 'tests/dsh-project-bundle*.test.mjs', 'tests/dsh-display-preview.test.mjs', 'tests/fixtures/dsh-bundle.mjs', 'tests/fixtures/export-dsh-bundle.py', 'tests/test_dsh_project_bundle.py', 'packages/runtime/src/dsh-branch-history.ts', 'tests/dsh-branch-history.test.mjs', 'tests/fixtures/dsh-branch-runtime.mjs', 'tests/harness-dsh-branch-chromium.test.mjs', 'packages/runtime/src/dsh-archived-family.ts', 'tests/dsh-archived-family.test.mjs', 'tests/fixtures/dsh-family*.mjs', 'tests/harness-dsh-family-chromium.test.mjs', 'services/lifecycle/shared_profile.py', 'services/companion_import.py', 'services/prompt-library/service.py', 'services/memory/service.py', 'packages/runtime/src/shared-profile-import.ts', 'scripts/import-shared-profile.mjs', 'tests/shared-profile*.test.mjs', 'tests/fixtures/shared-profile*', 'tests/harness-shared-profile-chromium.test.mjs', 'tests/test_shared_profile_lease.py', 'packages/runtime/src/native-profile-import.ts', 'packages/runtime/src/native-relocation-context.ts', 'scripts/import-native-profile.mjs', 'tests/native-profile-import.test.mjs', 'tests/fixtures/native-profile-runtime.mjs', 'tests/harness-native-profile-import-chromium.test.mjs', 'packages/runtime/src/dsh-tool-recovery.ts', 'tests/dsh-project-tool-recovery*.test.mjs', 'tests/fixtures/dsh-tool-recovery-project.mjs', 'packages/runtime/src/dsh-project-import.ts', 'packages/runtime/src/dsh-project-batch.ts', 'packages/runtime/src/profile-lease.ts', 'packages/runtime/src/profile-transaction.ts', 'packages/runtime/src/main.ts', 'packages/runtime/src/storage.ts', 'services/platform_adapters/profile_lease.py', 'scripts/import-dsh-projects.mjs', 'tests/dsh-project-batch*.test.mjs', 'tests/profile-transaction.test.mjs', 'tests/pi-owner.test.mjs', 'tests/fixtures/dsh-batch*.mjs', 'packages/runtime/src/dsh-history-media.ts', 'packages/runtime/src/dsh-history-surface.ts', 'tests/dsh-project-surface*.test.mjs', 'tests/fixtures/dsh-surface*.mjs', 'tests/dsh-project-rich*.test.mjs', 'tests/fixtures/dsh-rich*.mjs', 'scripts/export-dsh-project.py', 'scripts/import-dsh-project.mjs', 'tests/dsh-project-import.test.mjs', 'tests/dsh-project-multi-runtime.test.mjs', 'tests/harness-dsh*', 'tests/fixtures/dsh-project.mjs', 'tests/test_dsh_project_export.py', 'packages/runtime/src/memory-settings.ts', 'tests/memory-settings.test.mjs', 'tests/pi-memory-settings.test.mjs', 'tests/harness-memory-settings*.mjs', 'services/memory/**', 'packages/runtime/src/dictation.ts', 'tests/harness-dictation*.mjs', 'tests/fixtures/dictation*.mjs', 'tests/fixtures/pi-voice.mjs', 'tests/fixtures/pi-voice-native.py', 'tests/pi-voice-surfaces.test.mjs', 'tests/test_pi_voice.py', 'packages/prompt-library/src/input-mode.ts', 'packages/runtime/src/input-mode.ts', 'packages/runtime/src/queue.ts', 'packages/runtime/src/context-provenance.ts', 'packages/runtime/src/observations.ts', 'packages/memory/src/pi.ts', 'packages/memory/src/pi-snapshot.ts', 'tests/pi-input-mode.test.mjs', 'tests/pi-memory-snapshot.test.mjs', 'tests/pi-prompt-queue.test.mjs', 'packages/voice/**', 'packages/runtime/src/voice.ts', 'tests/pi-voice.test.mjs', 'tests/pi-voice-host.test.mjs', 'tests/pi-upload-maintenance.test.mjs', 'tests/harness-file-preview.test.mjs', 'tests/harness-file-references.test.mjs', 'tests/fixtures/codex/synthetic-voice-peer.mjs', 'services/workspaces/**', 'apps/browser/**', 'apps/harness/**', 'packages/codex-runtime/**', 'packages/runtime/src/model-account*', 'packages/runtime/src/model-settings.ts', 'packages/runtime/src/tool-argument-snapshots.ts', 'packages/runtime/src/office-*', 'packages/runtime/src/archive-snapshot.ts', 'packages/runtime/src/session-archive.ts', 'packages/runtime/src/session-exports.ts', 'packages/runtime/src/attachments.ts', 'tests/pi-session-archive.test.mjs', 'tests/pi-session-exports.test.mjs', 'tests/harness-session-export*', 'packages/runtime/vendor/dsh-session-log-export/**', 'tests/archive-snapshot.test.mjs', 'packages/runtime/src/host.ts', 'packages/runtime/src/harness-server.ts', 'scripts/app-sdk-*', 'scripts/harness-local-plan*', 'tests/harness-local-plan-proof*', 'tests/harness-permission-defaults*', 'tests/pi-permission-defaults.test.mjs', 'packages/runtime/src/session-permission-contracts.ts', 'packages/runtime/src/session-skills.ts', 'packages/runtime/src/managed-skill-provenance.ts', 'packages/observation/src/provider-user.ts', 'tests/provider-user.test.mjs', 'tests/managed-skill-provenance.test.mjs', 'tests/pi-skill-provenance.test.mjs', 'tests/pi-context-provenance.test.mjs', 'tests/session-skills.test.mjs', 'tests/pi-skill-workflows.test.mjs', 'tests/harness-skills*', 'tests/session-permission-contracts.test.mjs', 'tests/pi-session-permissions.test.mjs', 'tests/harness-session-permissions*', 'scripts/install-embedding.py', 'scripts/embed-launch.py', 'tests/*workspace*', 'tests/model-account*', 'tests/tool-argument-snapshots.test.mjs', 'tests/office-native-linux.test.mjs', 'tests/harness-account-scope*', 'tests/harness-model-invalidation*', 'tests/harness-session-create*', 'tests/harness-question-drafts*', 'tests/test_app_sdk_platform.py', 'apps/home/**', 'packages/home-client/**', 'packages/runtime/src/home.ts', 'packages/runtime/src/questions.ts', 'packages/runtime/src/plan-mode*', 'tests/pi-plan-mode.test.mjs', 'tests/plan-mode-contracts.test.mjs', 'tests/fixtures/windows-plan-*', 'packages/runtime/src/interactions.ts', 'packages/pi-linux/**', 'tests/pi-question*.mjs', 'tests/pi-interactions.test.mjs', 'adapters/dsh-home/**', 'tests/home-client.test.mjs', '.github/workflows/app-sdk.yml']
  workflow_dispatch:
    inputs:
      platform:
        description: Qualification scope (pull requests still test every platform)
        type: choice
        default: all
        options: [all, linux]
permissions:
  contents: read
jobs:
  contracts:
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.platform == 'linux' && '["ubuntu-24.04"]' || '["ubuntu-24.04", "macos-14", "windows-2025"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.19.0'
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9
        with:
          version: '0.11.16'
          enable-cache: false
      - run: uv python install 3.13.5
      - run: uv venv --python 3.13.5 .sdk-test-python
      - name: Select isolated qualification interpreter
        run: node -e "const fs=require('fs'),p=require('path'); const py=p.resolve('.sdk-test-python',process.platform==='win32'?'Scripts/python.exe':'bin/python');fs.appendFileSync(process.env.GITHUB_ENV,'AUGMENTOR_PYTHON='+py+'\nPYTHONDONTWRITEBYTECODE=1\n');"
      - name: Prepare locked shared companion test dependencies
        run: node -e "const cp=require('child_process'); const r=cp.spawnSync('uv',['pip','install','--python',process.env.AUGMENTOR_PYTHON,'--require-hashes','--no-deps','--only-binary=:all:','-r','tests/fixtures/shared-companion-requirements.txt'],{stdio:'inherit'});process.exit(r.status??1);"
      - name: Prepare locked Linux profile-inspection dependencies
        if: runner.os == 'Linux'
        run: node -e "const cp=require('child_process');const r=cp.spawnSync('uv',['pip','install','--python',process.env.AUGMENTOR_PYTHON,'--require-hashes','--no-deps','--only-binary=:all:','-r','tests/fixtures/dsh-preservation-requirements.txt'],{stdio:'inherit'});process.exit(r.status??1);"
      - name: Prepare locked Windows companion test dependencies
        if: runner.os == 'Windows'
        run: >-
          uv pip install --python .sdk-test-python/Scripts/python.exe --require-hashes --no-deps
          --only-binary=:all: -r tests/fixtures/windows-plan-requirements.txt
      - run: npm ci --ignore-scripts
      - run: npm run check
      - name: Verify original GUI dependency resolution on this platform
        run: node --test tests/harness-build-resolution.test.mjs
      - run: npm run build
      - name: Verify Linux DSH setup family, preservation and rollback
        if: runner.os == 'Linux'
        run: node -e "const cp=require('child_process');const r=cp.spawnSync(process.env.AUGMENTOR_PYTHON,['-B','-m','unittest','discover','-s','tests','-p','test_dsh*setup.py','-v'],{stdio:'inherit'});process.exit(r.status??1);"
      - name: Verify private Linux DSH preservation staging and stale refusal
        if: runner.os == 'Linux'
        run: node -e "const cp=require('child_process');const r=cp.spawnSync(process.env.AUGMENTOR_PYTHON,['-B','-m','unittest','discover','-s','tests','-p','test_dsh_preservation.py','-v'],{stdio:'inherit'});process.exit(r.status??1);"
      - name: Verify interruption context and bounded response recovery
        run: node --test tests/pi-execution.test.mjs
      - name: Verify recognition-only Pi transport and operator gateway
        run: node --test tests/harness-dictation.test.mjs tests/harness-dictation-host.test.mjs
      - name: Verify shared memory settings, stale choices and inspector boundaries
        run: node --test --test-concurrency=2 tests/memory-settings.test.mjs tests/harness-memory-settings.test.mjs tests/pi-memory-settings.test.mjs
      - name: Verify Pi input modes, memory and scoped voice transport
        run: node --test tests/pi-input-mode.test.mjs tests/pi-memory-snapshot.test.mjs tests/pi-prompt-queue.test.mjs tests/pi-context-provenance.test.mjs tests/pi-voice.test.mjs tests/pi-voice-host.test.mjs tests/pi-upload-maintenance.test.mjs tests/harness-file-preview.test.mjs tests/harness-file-references.test.mjs
      - name: Verify shared Harness session creation and draft scopes
        run: node --test tests/harness-session-create.test.mjs
      - name: Verify shared Harness catalog read and mutation ordering
        run: node --test tests/harness-workspace-ordering.test.mjs
      - name: Prepare locked browser-only test dependencies
        run: npm ci --prefix apps/browser/test --ignore-scripts
      - name: Verify shared prompt ordering and job editor refresh state
        run: node --test apps/browser/test/prompt-editor-ordering.test.mjs apps/browser/test/prompts.test.mjs apps/browser/test/jobs-refresh.test.mjs
      - name: Verify shared Pi accounts, model invalidation and transient operator scopes
        run: node --test tests/model-account-login.test.mjs tests/model-accounts.test.mjs tests/harness-account-scope.test.mjs tests/harness-model-invalidation.test.mjs
      - name: Verify shared SDK argument snapshots, quiet bursts and retirement
        run: node --test tests/tool-argument-snapshots.test.mjs
      - name: Verify offline project import, independent native histories and cold continuation
        run: node --test --test-concurrency=2 tests/dsh-display-preview.test.mjs tests/dsh-project-settlement.test.mjs tests/dsh-project-tool-recovery.test.mjs tests/dsh-project-import.test.mjs tests/dsh-project-multi-runtime.test.mjs tests/dsh-project-rich.test.mjs tests/dsh-project-rich-runtime.test.mjs tests/dsh-project-surface.test.mjs tests/dsh-project-surface-runtime.test.mjs tests/dsh-project-batch.test.mjs tests/dsh-project-batch-runtime.test.mjs tests/profile-transaction.test.mjs
      - name: Verify MX complete project bundles and exact archived originals
        if: runner.os == 'Linux'
        run: node --test --test-concurrency=2 tests/dsh-project-bundle.test.mjs tests/dsh-project-bundle-runtime.test.mjs tests/dsh-project-files.test.mjs tests/dsh-project-files-runtime.test.mjs
      - name: Verify MX atomic segmented project export
        if: runner.os == 'Linux'
        run: node -e "const cp=require('child_process'); const r=cp.spawnSync(process.env.AUGMENTOR_PYTHON,['-m','unittest','discover','-s','tests','-p','test_dsh_project_bundle.py','-v'],{stdio:'inherit'});process.exit(r.status??1);"
      - name: Verify MX exact file attachment export
        if: runner.os == 'Linux'
        run: node -e "const cp=require('child_process'); const r=cp.spawnSync(process.env.AUGMENTOR_PYTHON,['-m','unittest','discover','-s','tests','-p','test_dsh_project_files.py','-v'],{stdio:'inherit'});process.exit(r.status??1);"
      - name: Verify MX profile ownership and SDK drain
        if: runner.os == 'Linux'
        run: node --test --test-concurrency=2 tests/dsh-project-settlement-runtime.test.mjs tests/dsh-project-tool-recovery-runtime.test.mjs tests/pi-owner.test.mjs tests/native-profile-import.test.mjs tests/native-dsh-file-hints.test.mjs tests/native-dsh-file-hints-runtime.test.mjs tests/shared-profile-import.test.mjs tests/shared-profile-runtime.test.mjs tests/dsh-archived-family.test.mjs tests/dsh-branch-history.test.mjs
      - name: Verify shared companion data ownership and startup fencing
        run: node -e "const cp=require('child_process'); const r=cp.spawnSync(process.env.AUGMENTOR_PYTHON,['-m','unittest','discover','-s','tests','-p','test_shared_profile_lease.py','-v'],{stdio:'inherit'});process.exit(r.status??1);"
      - name: Verify read-only multi-conversation project export
        run: node -e "const cp=require('child_process'); const r=cp.spawnSync(process.env.AUGMENTOR_PYTHON,['-m','unittest','discover','-s','tests','-p','test_dsh_project_export.py','-v'],{stdio:'inherit'});process.exit(r.status??1);"
      - name: Verify session archive selection, one-use downloads and ZIP lifecycle
        run: node --test tests/archive-snapshot.test.mjs tests/pi-session-archive.test.mjs tests/pi-session-exports.test.mjs tests/harness-session-export.test.mjs
      - name: Verify shared Office provider admission, cancellation and capacity
        run: node --test --test-name-pattern="original provider admits|converter seat cancellation|original provider writes only" tests/office-native-linux.test.mjs
      - name: Verify real MCP timeout cancellation and retained sibling receipts
        run: node --test tests/pi-mcp-authorization.test.mjs
      - name: Verify shared question batches, decisions and scoped timing controls
        run: node --test tests/pi-question-contracts.test.mjs tests/pi-interactions.test.mjs tests/harness-question-drafts.test.mjs tests/harness-local-plan-proof.test.mjs
      - name: Verify current-chat permissions, new-chat defaults and original GUI bindings
        run: node --test tests/harness-permission-defaults.test.mjs tests/pi-permission-defaults.test.mjs tests/session-permission-contracts.test.mjs tests/pi-session-permissions.test.mjs tests/harness-session-permissions.test.mjs
      - name: Verify shared approved skill scope, source fingerprints and original GUI service faces
        run: node --test tests/session-skills.test.mjs tests/pi-skill-workflows.test.mjs tests/harness-skills.test.mjs tests/provider-user.test.mjs tests/managed-skill-provenance.test.mjs tests/pi-skill-provenance.test.mjs tests/pi-context-provenance.test.mjs
      - name: Verify shared plan-mode state, public SDK lifecycle and operator scope
        run: node --test tests/plan-mode-contracts.test.mjs tests/pi-plan-mode.test.mjs
      - name: Verify shared Home client authority and durable request receipts
        run: node --test tests/home-client.test.mjs
      - name: Verify OS private files and startup contracts
        run: node -e "const cp=require('child_process'); const r=cp.spawnSync(process.env.AUGMENTOR_PYTHON,['-m','unittest','discover','-s','tests','-p','test_app_sdk_platform.py','-v'],{stdio:'inherit'});process.exit(r.status??1);"
      - name: Verify workspace capability contract
        run: node --test tests/workspace-capabilities.test.mjs apps/browser/test/workspace-context.test.mjs
      - name: Verify actual pinned Codex workspace engine
        if: runner.os != 'Windows'
        run: node --test tests/codex-operations.test.mjs tests/codex-session.test.mjs tests/codex-workspaces.test.mjs
      - name: Verify source registration and native frame boundary
        if: runner.os == 'Linux'
        run: node scripts/app-sdk-bundle-proof.mjs .
