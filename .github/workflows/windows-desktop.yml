name: Windows desktop
on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/windows-desktop.yml'
      - 'apps/native/**'
      - 'services/platform_adapters/**'
      - 'services/lifecycle/**'
      - 'services/platform/**'
      - 'services/windows_supervisor.py'
      - 'scripts/windows-window-proof.py'
      - 'scripts/windows-launcher-lease-proof.py'
      - 'scripts/build-windows-launcher.py'
      - 'scripts/windows-desktop-proof.py'
      - 'scripts/bootstrap-windows.py'
      - 'tests/**'
      - 'release/windows/**'
permissions:
  contents: read
concurrency:
  group: windows-desktop-${{ github.ref }}
  cancel-in-progress: false
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            arch: x64
          - os: windows-11-arm
            arch: arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Stage private hash-locked runtime
        id: bootstrap
        run: python -Xutf8 scripts/bootstrap-windows.py --arch ${{ matrix.arch }} --out outputs/payload
      - name: Verify native publisher signature and pinned-key refusal
        if: ${{ !cancelled() && steps.bootstrap.outcome == 'success' }}
        env:
          AUGMENTOR_WINDOWS_SIGNING_PROOF_ROOT: outputs/payload
        run: |
          # Read-only trust fixture; no app receipt, policy, certificate or target execution.
          New-Item -ItemType Directory -Force outputs/payload/scripts | Out-Null
          Copy-Item scripts/verify-windows-publisher.ps1 outputs/payload/scripts/
          & outputs/payload/python/python.exe -Xutf8 -B -m unittest discover -s tests -p test_update_windows_signing.py -v
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Exercise shared native appearance and interaction behavior
        if: ${{ !cancelled() && steps.bootstrap.outcome == 'success' }}
        env:
          QT_QPA_PLATFORM: offscreen
          PYTHONPATH: apps/native
        run: |
          & outputs/payload/python/python.exe -Xutf8 -B -m unittest discover -s tests -p test_ui_scale.py -v
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          & outputs/payload/python/python.exe -Xutf8 -B -m unittest discover -s tests -p test_fluid.py -v
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          & outputs/payload/python/python.exe -Xutf8 -B -m unittest discover -s tests -p test_window.py -v
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          & outputs/payload/python/python.exe -Xutf8 -B -m unittest discover -s tests -p test_windows_instance.py -v
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          & outputs/payload/python/python.exe -Xutf8 -B -m unittest discover -s tests -p test_managed_setup_ui.py -v
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          & outputs/payload/python/python.exe -Xutf8 -B -m unittest discover -s tests -p test_windows_launcher.py -v
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          & outputs/payload/python/python.exe -Xutf8 -B -m unittest discover -s tests -p test_windows_browser_setup_ui.py -v
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          & outputs/payload/python/python.exe -Xutf8 -B -m unittest discover -s tests -p test_maintenance_admission.py -v
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          & outputs/payload/python/python.exe -Xutf8 -B -m unittest discover -s tests -p test_maintenance_reservations.py -v
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          & outputs/payload/python/python.exe -Xutf8 -B -m unittest discover -s tests -p 'test_update_*.py' -v
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          & outputs/payload/python/python.exe -Xutf8 -B -m unittest discover -s tests -p test_windows_identity.py -v
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          & outputs/payload/python/python.exe -Xutf8 -B -m unittest discover -s tests -p test_payload_integrity.py -v
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          & outputs/payload/python/python.exe -Xutf8 -B -m unittest discover -s tests -p test_recovery_source.py -v
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          & outputs/payload/python/python.exe -Xutf8 -B -m unittest discover -s tests -p test_health_report.py -v
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          & outputs/payload/python/python.exe -Xutf8 -B -m unittest discover -s tests -p test_windows_preparation.py -v
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          & outputs/payload/python/python.exe -Xutf8 -B -m unittest discover -s tests -p test_desktop_maintenance.py -v
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          & outputs/payload/python/python.exe -Xutf8 -B -m unittest discover -s tests -p test_dsh_setup.py -v
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          & outputs/payload/python/python.exe -Xutf8 -B -m unittest discover -s tests -p test_complete_setup.py -v
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          & outputs/payload/python/python.exe -Xutf8 -B -m unittest discover -s tests -p test_local_services.py -k memory_ -v
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          & outputs/payload/python/python.exe -Xutf8 -B -m unittest discover -s tests -p test_memory_budget.py -k gateway -v
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          & outputs/payload/python/python.exe -Xutf8 -B -m unittest discover -s tests -p test_macos_setup_ui.py -v
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          & outputs/payload/python/python.exe -Xutf8 -B -m augmentor_linux --preview --screenshot outputs/evidence/desktop.png
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Verify actual Windows Qt fonts and preview rendering
        if: ${{ !cancelled() && steps.bootstrap.outcome == 'success' }}
        env:
          QT_QPA_PLATFORM: windows
          QSG_RHI_PREFER_SOFTWARE_RENDERER: '1'
          PYTHONPATH: apps/native
        run: |
          & outputs/payload/python/python.exe -Xutf8 -B -m unittest discover -s tests -p test_windows_shortcuts.py -v
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          & outputs/payload/python/python.exe -Xutf8 -B -m unittest discover -s tests -p test_windows_supervisor.py -v
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          & outputs/payload/python/python.exe -Xutf8 -B -m unittest discover -s tests -p test_windows_voice.py -v
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          & outputs/payload/python/python.exe -Xutf8 -B -m unittest discover -s tests -p test_windows_processes.py -v
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          & outputs/payload/python/python.exe -Xutf8 -B -m unittest discover -s tests -p test_windows_startup.py -v
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          & outputs/payload/python/python.exe -Xutf8 -B -m unittest discover -s tests -p test_windows_startup_fence.py -v
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          & outputs/payload/python/python.exe -Xutf8 -B -m unittest discover -s tests -p test_windows_http.py -v
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          & outputs/payload/python/python.exe -Xutf8 -B -m unittest discover -s tests -p test_windows_browser.py -v
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          & outputs/payload/python/python.exe -Xutf8 -B -m unittest discover -s tests -p test_browser_control.py -v
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          & outputs/payload/python/python.exe -Xutf8 -B -m unittest discover -s tests -p test_local_health.py -v
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          & outputs/payload/python/python.exe -Xutf8 -B scripts/windows-desktop-proof.py --out outputs/evidence
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          & outputs/payload/python/python.exe -Xutf8 -B scripts/windows-window-proof.py --out outputs/evidence
      - name: Qualify native startup exclusion before loading Python
        if: ${{ !cancelled() && steps.bootstrap.outcome == 'success' }}
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          & outputs/payload/python/python.exe -Xutf8 -B scripts/windows-launcher-lease-proof.py --runtime outputs/payload --arch ${{ matrix.arch }} --out outputs/evidence
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: windows-desktop-${{ matrix.arch }}
          path: outputs/evidence/**
          retention-days: 14
          if-no-files-found: warn
